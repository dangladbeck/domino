<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominó Acessível</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/game.js"></script>
</head>
<body>
    <div id="canvas">
        <div id="titleScreen" aria-label="tela inicial">
            <h1><span hidden>Bem vindo ao jogo de </span>Dominó</h1>
            <nav>
                <button id="btnPlay">JOGAR</button>
                <button id="btnHelp">Instruções</button>
            </nav>
        </div>
        <div id="newGameScreen" hidden>
            <h2>Novo Jogo</h2>
            <fieldset aria-label="Selecione o número de jogadores.">
                <input type="radio" name="players" id="btn2Players" value="2" checked aria-checked="true">
                <label for="btn2Players">2 Jogadores</label>
                <input type="radio" name="players" id="btn3Players" value="3">
                <label for="btn3Players">3 Jogadores</label>
                <input type="radio" name="players" id="btn4Players" value="4">
                <label for="btn4Players">4 Jogadores</label>
            </fieldset>
            <button id="btnStart">Iniciar</button>
            <button id="btnBack">Voltar</button>
        </div>
        <div id="levelScreen" aria-label="tela de jogo" hidden>
            <div id="menu">
                <h2>Jogo de Dominó</h2>
                <p id="playerCount">X Jogadores</p>
            </div>
            <div id="playerHand" aria-label="suas pedras">
                <!--button class="piece"><div class="half">1</div><div class="half">2</div></button>
                <button class="piece"><div class="half">1</div><div class="half">1</div></button>
                <button class="piece"><div class="half">0</div><div class="half">4</div></button>
                <button class="piece"><div class="half">1</div><div class="half">3</div></button>
                <button class="piece"><div class="half">0</div><div class="half">3</div></button>
                <button class="piece"><div class="half">6</div><div class="half">6</div></button>
                <button class="piece"><div class="half">0</div><div class="half">5</div></button-->
            </div>
            <div id="aiHand2">
                <div class="closed"><div class="half"></div><div class="half"></div></div>
                <div class="closed"><div class="half"></div><div class="half"></div></div>
                <div class="closed"><div class="half"></div><div class="half"></div></div>
                <div class="closed"><div class="half"></div><div class="half"></div></div>
                <div class="closed"><div class="half"></div><div class="half"></div></div>
                <div class="closed"><div class="half"></div><div class="half"></div></div>
                <div class="closed"><div class="half"></div><div class="half"></div></div>
            </div>
            <div id="aiHand3">
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
            </div>
            <div id="aiHand4">
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
                <div class="piece closed"><div class="half"></div><div class="half"></div></div>
            </div>
            <div id="table">
                
            </div>
            <div id="bank">

            </div>
        </div>
        <div id="helpScreen" aria-label="tela de ajuda" hidden>
            <h2>Como Jogar Dominó</h2>
            <button id="btnBack2">Voltar</button>
        </div>
    </div>
</body>
</html>
